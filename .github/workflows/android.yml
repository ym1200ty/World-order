name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: "4.7"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-4.7-official

      - name: Install Godot and export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.official
          if [ ! -f ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.official/android_debug.apk ]; then
            wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
            unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz -d tpl
            mv tpl/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable.official/
          fi

      - name: Install Android SDK parts
        run: |
          export ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest"

      - name: Create debug keystore
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey \
            -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Import project and configure Godot for Android
        run: |
          godot --headless --path . --import || true
          mkdir -p ~/.config/godot
          SETTINGS=~/.config/godot/editor_settings-4.tres
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\n' > "$SETTINGS"
          ANDROID_HOME=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}
          cat >> "$SETTINGS" <<EOF
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/debug_keystore = "$PWD/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Install Android Build Template
        run: |
          godot --headless --path . --install-android-build-template

      - name: Export APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/WorldOrder.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WorldOrder-apk
          path: build/WorldOrder.apk
